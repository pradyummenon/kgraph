[project]
name = "kgraph"
version = "0.1.0"
description = "CLI tool for building and querying knowledge graphs from documents"
requires-python = ">=3.10"
authors = [
    { name = "pradyummenon" },
]
readme = "README.md"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "neo4j>=5.0.0",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "google-genai>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
viz = [
    "networkx>=3.0",
    "phart>=0.5.0",
]

[project.scripts]
kgraph = "kgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgraph"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
